<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>형사 절차의 흐름 — 모션 그래픽 + 퀴즈</title>
<style>
:root{--ink:#1F2430;--bg:#FFF8EE;--inv:#E8913A;--inv2:#FFF1DE;--pro:#1F6FB2;--pro2:#E3F0FB;--tri:#5DA544;--tri2:#EAF6E3;--exe:#1E9FAB;--exe2:#E0F5F6;--red:#D6453D;--gold:#F2B705}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#1b1e27;font-family:"Pretendard","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif;color:var(--ink);user-select:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;flex-shrink:0;width:1600px;height:900px;background:var(--bg);overflow:hidden;transform-origin:center center;border-radius:6px}
#stage.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translate(0,0) rotate(var(--r,0deg)) scale(var(--s))}20%{transform:translate(-14px,6px) rotate(var(--r,0deg)) scale(var(--s))}40%{transform:translate(12px,-8px) rotate(var(--r,0deg)) scale(var(--s))}60%{transform:translate(-8px,4px) rotate(var(--r,0deg)) scale(var(--s))}80%{transform:translate(6px,-2px) rotate(var(--r,0deg)) scale(var(--s))}}
/* 상단 진행 표시 */
#top{position:absolute;left:0;right:0;top:0;height:70px;display:flex;align-items:center;gap:10px;padding:0 30px;z-index:20}
.chip{padding:8px 22px;border-radius:30px;font-weight:800;font-size:22px;background:#0000000d;color:#0005;transition:.4s}
.chip.on{color:#fff;transform:scale(1.08);box-shadow:0 4px 12px #0003}
.chip.done{color:#fff;opacity:.55}
.chip.c0.on,.chip.c0.done{background:var(--inv)}.chip.c1.on,.chip.c1.done{background:var(--pro)}.chip.c2.on,.chip.c2.done{background:var(--tri)}.chip.c3.on,.chip.c3.done{background:var(--exe)}
.arrowchip{color:#0003;font-size:22px;font-weight:900}
#tools{margin-left:auto;display:flex;gap:8px}
.tbtn{border:none;background:#fff;border-radius:12px;padding:8px 14px;font-size:20px;font-weight:700;cursor:pointer;box-shadow:0 2px 6px #0002;font-family:inherit;color:var(--ink)}
.tbtn:hover{transform:translateY(-2px)}
.tbtn.act{background:var(--ink);color:#fff}
#bar{position:absolute;left:0;top:0;height:6px;background:linear-gradient(90deg,var(--inv),var(--pro),var(--tri),var(--exe));transition:width .6s;z-index:21}
/* 아래 넘김 */
#nav{position:absolute;bottom:18px;right:30px;display:flex;gap:10px;z-index:20}
#nav button{border:none;border-radius:16px;padding:12px 26px;font-size:24px;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 3px 8px #0003}
#prev{background:#fff;color:var(--ink)}#next{background:var(--ink);color:#fff}
#pg{position:absolute;bottom:30px;left:34px;font-size:20px;color:#0006;font-weight:700;z-index:20}
/* 장면 공통 */
.scene{position:absolute;inset:0;padding:90px 70px 90px}
.stitle{display:flex;align-items:center;gap:18px;margin-bottom:26px}
.stitle .no{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:30px;font-weight:900}
.stitle h2{font-size:52px;font-weight:900;letter-spacing:-1px}
.stitle small{font-size:24px;color:#0007;font-weight:700;margin-left:6px}
.card{background:#fff;border-radius:26px;padding:26px 30px;box-shadow:0 6px 20px #0000001a}
.big{font-size:34px;font-weight:800;line-height:1.45}
.mid{font-size:28px;font-weight:600;line-height:1.5}
.sm{font-size:23px;line-height:1.5;color:#000b}
.hl{background:linear-gradient(transparent 55%,#FFE066 55%);padding:0 4px}
.tag{display:inline-block;padding:6px 18px;border-radius:30px;color:#fff;font-weight:800;font-size:24px}
.row{display:flex;gap:26px;align-items:stretch}
.center{display:flex;align-items:center;justify-content:center}
.emo{font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif}
/* 등장 효과 */
.a{opacity:0;animation-duration:.7s;animation-fill-mode:both;animation-delay:var(--d,0s);animation-timing-function:cubic-bezier(.2,.9,.25,1.25)}
.up{animation-name:up}@keyframes up{from{opacity:0;transform:translateY(50px)}to{opacity:1;transform:none}}
.pop{animation-name:pop}@keyframes pop{0%{opacity:0;transform:scale(.2)}70%{opacity:1;transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
.lft{animation-name:lft}@keyframes lft{from{opacity:0;transform:translateX(-120px)}to{opacity:1;transform:none}}
.rgt{animation-name:rgt}@keyframes rgt{from{opacity:0;transform:translateX(120px)}to{opacity:1;transform:none}}
.drop{animation-name:drop;animation-timing-function:cubic-bezier(.5,0,.75,0)}@keyframes drop{0%{opacity:0;transform:translateY(-500px)}80%{opacity:1;transform:translateY(10px)}100%{opacity:1;transform:none}}
.fade{animation-name:fade;animation-timing-function:ease}@keyframes fade{from{opacity:0}to{opacity:1}}
.stamp{animation-name:stamp;animation-duration:.4s;animation-timing-function:ease-in}@keyframes stamp{0%{opacity:0;transform:scale(3.2) rotate(-25deg)}100%{opacity:1;transform:scale(1) rotate(-10deg)}}
.flip{animation-name:flip;animation-duration:.8s}@keyframes flip{0%{opacity:0;transform:perspective(900px) rotateY(90deg)}100%{opacity:1;transform:perspective(900px) rotateY(0)}}
.bob{animation:bob 2.2s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.wig{animation:wig 1s ease-in-out infinite}@keyframes wig{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.blinkL{animation:blinkL .5s steps(1) infinite}@keyframes blinkL{50%{opacity:.25}}
.drawp path,.drawp line{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.1s ease forwards;animation-delay:var(--d,0s)}
@keyframes draw{to{stroke-dashoffset:0}}
/* 신분 배지 바꾸기 */
.swap{position:relative;display:inline-block;height:64px;min-width:200px}
.swap span{position:absolute;left:0;right:0;top:0;text-align:center;padding:10px 24px;border-radius:40px;color:#fff;font-weight:900;font-size:32px;white-space:nowrap}
.swap .old{animation:out .45s ease forwards;animation-delay:var(--d)}
.swap .new{opacity:0;animation:inb .6s cubic-bezier(.2,.9,.25,1.4) forwards;animation-delay:calc(var(--d) + .4s)}
@keyframes out{to{opacity:0;transform:rotateX(90deg) scale(.6)}}
@keyframes inb{0%{opacity:0;transform:scale(.2) rotate(-15deg)}100%{opacity:1;transform:none}}
/* 사람 */
.person .eyes{animation:blink 4s infinite;transform-origin:60px 58px}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
/* 표지 */
#cover{background:radial-gradient(circle at 50% 40%,#2c3350,#141722)}
.lightL,.lightR{position:absolute;top:-200px;width:900px;height:900px;border-radius:50%;filter:blur(60px);opacity:.0}
.lightL{left:-300px;background:#ff2a2a;animation:pol 1s infinite}
.lightR{right:-300px;background:#2a6bff;animation:pol 1s infinite .5s}
@keyframes pol{0%,100%{opacity:0}25%{opacity:.55}50%{opacity:0}}
.ctitle{font-size:118px;font-weight:900;color:#fff;letter-spacing:-3px;text-shadow:0 8px 30px #000a}
.csub{font-size:32px;color:#ffffffcc;font-weight:600;margin-top:16px}
.startbtn{margin-top:60px;border:none;border-radius:60px;padding:24px 70px;font-size:44px;font-weight:900;background:var(--gold);color:#222;cursor:pointer;font-family:inherit;box-shadow:0 10px 0 #b98a00,0 18px 30px #0008;animation:pulse 1.4s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.tape{position:absolute;left:-100px;right:-100px;height:64px;background:repeating-linear-gradient(-45deg,#F2B705 0 50px,#222 50px 100px);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:30px;letter-spacing:6px}
.tape b{background:#F2B705;padding:4px 24px;color:#222}
/* 갈림길 */
.box{background:#fff;border-radius:22px;padding:18px 24px;box-shadow:0 6px 18px #0000001f}
.fly{position:absolute;font-size:70px;offset-rotate:0deg}
/* 법정 */
.bench{position:absolute;left:470px;top:140px;width:660px;height:200px;background:linear-gradient(#8B5A2B,#6b4220);border-radius:20px 20px 0 0;box-shadow:inset 0 -14px 0 #0003}
.gavel{position:absolute;font-size:150px;transform-origin:80% 80%}
.gavel.hit{animation:hit .9s ease-in-out 3;animation-delay:var(--d)}
@keyframes hit{0%,100%{transform:rotate(0)}40%{transform:rotate(-40deg)}55%{transform:rotate(12deg)}70%{transform:rotate(0)}}
/* 흐름 정리 */
.flow{display:flex;gap:14px;align-items:stretch;height:500px}
.fcol{border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:12px}
.fcol h3{text-align:center;color:#fff;font-size:30px;padding:8px;border-radius:14px}
.fn{background:#fff;border-radius:14px;padding:10px 14px;font-size:22px;font-weight:700;line-height:1.35;box-shadow:0 2px 6px #0001}
.fn small{display:block;font-weight:500;font-size:18px;color:#0009}
.idbar{display:flex;margin-top:20px;border-radius:40px;overflow:hidden;height:60px;font-size:28px;font-weight:900;color:#fff}
.idbar div{display:flex;align-items:center;justify-content:center}
/* 퀴즈 */
#quiz{background:linear-gradient(135deg,#2b2f4a,#1a1d2e)}
.qhead{display:flex;align-items:center;gap:20px;color:#fff}
.qnum{font-size:30px;font-weight:900;background:var(--gold);color:#222;border-radius:16px;padding:8px 22px}
.qscore{margin-left:auto;font-size:30px;font-weight:900}
.combo{font-size:26px;font-weight:900;color:var(--gold);min-width:150px;text-align:right}
.qcard{background:#fff;border-radius:30px;padding:36px 46px;margin-top:22px;font-size:44px;font-weight:800;line-height:1.45;min-height:200px;display:flex;align-items:center}
.timer{height:16px;border-radius:10px;background:#ffffff26;margin-top:18px;overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#5DD39E,#F2B705,#E5534B);transform-origin:left}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:24px}
.ch{word-break:keep-all;border:none;border-radius:24px;padding:22px 26px;font-size:32px;font-weight:800;text-align:left;cursor:pointer;font-family:inherit;color:#fff;display:flex;align-items:center;gap:18px;box-shadow:0 7px 0 #0005;transition:transform .12s}
.ch:hover{transform:translateY(-3px)}
.ch .k{width:52px;height:52px;flex:none;border-radius:50%;background:#fff3;display:flex;align-items:center;justify-content:center;font-size:28px}
.ch.right{outline:8px solid #5DD39E;animation:pop .5s}
.ch.wrong{filter:grayscale(1) brightness(.6)}
.ch.dim{opacity:.35}
.ox{display:flex;gap:40px;justify-content:center;margin-top:26px}
.ox .ch{width:340px;height:220px;justify-content:center;font-size:150px;padding:0}
.expl{word-break:keep-all;margin-top:22px;border-radius:24px;padding:20px 30px;font-size:30px;font-weight:700;line-height:1.5;display:flex;gap:20px;align-items:center}
.expl.ok{background:#E6F8EF;color:#13643D}.expl.no{background:#FDECEA;color:#9B231C}
.result{text-align:center;color:#fff}
#fx{position:absolute;inset:0;pointer-events:none;z-index:30}
.bigmark{position:absolute;left:50%;top:50%;font-size:300px;font-weight:900;transform:translate(-50%,-50%);z-index:29;pointer-events:none;animation:mark .9s ease forwards}
@keyframes mark{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.3)}}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <div id="bar"></div>
  <div id="top"></div>
  <div id="scene"></div>
  <canvas id="fx" width="1600" height="900"></canvas>
  <div id="pg"></div>
  <div id="nav"><button id="prev">◀ 이전</button><button id="next">다음 ▶</button></div>
</div></div>
<script>
/* ===================== 효과음 (WebAudio, 음원 파일 없음) ===================== */
let AC=null, muted=false;
function ac(){ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); return AC; }
function tone(f,t,d,type='sine',v=.18,f2=null){ if(muted) return; const c=ac(),o=c.createOscillator(),g=c.createGain(),s=c.currentTime+t;
  o.type=type;o.frequency.setValueAtTime(f,s); if(f2) o.frequency.exponentialRampToValueAtTime(f2,s+d);
  g.gain.setValueAtTime(0.0001,s);g.gain.exponentialRampToValueAtTime(v,s+.015);g.gain.exponentialRampToValueAtTime(0.0001,s+d);
  o.connect(g).connect(c.destination);o.start(s);o.stop(s+d+.05); return o; }
function noise(t,d,v=.25,ff=1200,ft='lowpass',ff2=null){ if(muted) return; const c=ac(),n=c.sampleRate*d,b=c.createBuffer(1,n,c.sampleRate),a=b.getChannelData(0);
  for(let i=0;i<n;i++) a[i]=Math.random()*2-1; const src=c.createBufferSource();src.buffer=b; const fl=c.createBiquadFilter();fl.type=ft;
  const s=c.currentTime+t; fl.frequency.setValueAtTime(ff,s); if(ff2) fl.frequency.exponentialRampToValueAtTime(ff2,s+d);
  const g=c.createGain();g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(0.0001,s+d);
  src.connect(fl).connect(g).connect(c.destination);src.start(s); }
const SFX={
  siren(){ for(let i=0;i<4;i++){ tone(700,i*.5,.25,'sawtooth',.06,1100); tone(1100,i*.5+.25,.25,'sawtooth',.06,700);} },
  whoosh(){ noise(0,.45,.35,300,'bandpass',4000); },
  pop(){ tone(500,0,.12,'sine',.25,1300); },
  stamp(){ tone(120,0,.25,'sine',.5,40); noise(0,.18,.45,900); },
  gavel(){ for(let i=0;i<3;i++){ const t=.36+i*.9; tone(180,t,.22,'triangle',.5,60); noise(t,.12,.5,2500); } },
  boing(){ if(muted) return; const c=ac(),o=c.createOscillator(),g=c.createGain(),l=c.createOscillator(),lg=c.createGain(),s=c.currentTime;
    o.type='sine';o.frequency.setValueAtTime(150,s);o.frequency.exponentialRampToValueAtTime(620,s+.18);o.frequency.exponentialRampToValueAtTime(330,s+.6);
    l.frequency.value=18;lg.gain.value=40;l.connect(lg).connect(o.frequency);
    g.gain.setValueAtTime(.3,s);g.gain.exponentialRampToValueAtTime(.0001,s+.7);o.connect(g).connect(c.destination);o.start(s);l.start(s);o.stop(s+.75);l.stop(s+.75); },
  ding(){ [784,988,1319].forEach((f,i)=>tone(f,i*.11,.35,'triangle',.22)); },
  sad(){ [392,370,349,330].forEach((f,i)=>{ const d=i==3?.9:.32; const o=tone(f,i*.34,d,'sawtooth',.09); }); },
  buzz(){ tone(140,0,.5,'square',.12); tone(147,0,.5,'square',.08); },
  drum(){ for(let i=0;i<22;i++) noise(i*.07,.06,.12+i*.012,1800,'bandpass'); tone(90,1.6,.4,'sine',.5,50); noise(1.6,.5,.4,6000,'highpass'); },
  fanfare(){ [[523,0],[659,.13],[784,.26],[1047,.42]].forEach(([f,t])=>{tone(f,t,.3,'square',.08);tone(f/2,t,.3,'triangle',.12)}); tone(1047,.6,.8,'square',.09); tone(784,.6,.8,'triangle',.1); },
  coin(){ tone(988,0,.08,'square',.12); tone(1319,.08,.35,'square',.12); },
  tick(){ tone(1500,0,.04,'square',.06); },
  sparkle(){ [1568,2093,2637,3136].forEach((f,i)=>tone(f,i*.06,.25,'sine',.1)); },
  step(){ tone(220,0,.08,'triangle',.25,110); },
  door(){ tone(260,0,.5,'sawtooth',.05,180); noise(0,.5,.12,500); },
  cheer(){ noise(0,1.4,.25,1500,'bandpass'); SFX.fanfare(); },
  type(){ for(let i=0;i<10;i++) tone(1800+Math.random()*600,i*.07,.03,'square',.04); },
  combo(n){ for(let i=0;i<Math.min(n,6);i++) tone(660*Math.pow(1.122,i),i*.07,.15,'triangle',.18); }
};
function sfx(n,arg){ try{ SFX[n] && SFX[n](arg); }catch(e){} }

/* ===================== 그림 도우미 ===================== */
function person(o={}){
  const body=o.body||'#8892A6', w=o.w||150, skin='#FFDDBB';
  const hair=o.hair===false?'':`<path d="M27 52 Q30 20 60 20 Q92 20 93 52 Q84 34 60 34 Q38 34 27 52Z" fill="${o.hairc||'#3a2a1e'}"/>`;
  const extra=o.extra||'';
  const mouth=o.sad?'M48 80 Q60 70 72 80':'M47 74 Q60 86 73 74';
  return `<svg class="person" viewBox="0 0 120 170" width="${w}" height="${w*170/120}">
   <ellipse cx="60" cy="164" rx="40" ry="6" fill="#0002"/>
   <path d="M16 165 Q16 98 60 98 Q104 98 104 165Z" fill="${body}"/>${o.collar||''}
   <circle cx="60" cy="58" r="34" fill="${skin}"/>${hair}
   <g class="eyes"><circle cx="47" cy="58" r="4.5" fill="#222"/><circle cx="73" cy="58" r="4.5" fill="#222"/></g>
   <circle cx="38" cy="70" r="5" fill="#ff9a9a66"/><circle cx="82" cy="70" r="5" fill="#ff9a9a66"/>
   <path d="${mouth}" stroke="#222" stroke-width="3.5" fill="none" stroke-linecap="round"/>${o.sweat?'<path d="M95 40 q6 10 0 14 q-6 -4 0 -14Z" fill="#7cc6ff"/>':''}${extra}</svg>`;
}
const POLICE=person({body:'#2D4E8A',hair:false,extra:'<path d="M24 40 Q60 6 96 40 L96 46 L24 46Z" fill="#1d3461"/><rect x="20" y="42" width="80" height="8" rx="4" fill="#111"/><circle cx="60" cy="30" r="6" fill="#F2B705"/>'});
const SUSPECT=(s)=>person({body:'#8892A6',sweat:true,sad:true,w:s||150});
const PROSEC=person({body:'#22355e',collar:'<path d="M48 100 L60 124 L72 100Z" fill="#fff"/><path d="M57 104 L60 130 L63 104Z" fill="#c33"/>',hairc:'#222'});
const JUDGE=person({body:'#1b1b1f',collar:'<path d="M44 100 L60 118 L76 100Z" fill="#fff"/><rect x="56" y="104" width="8" height="40" fill="#7d1f2e"/>',hairc:'#555'});
const LAWYER=person({body:'#5a3d7a',collar:'<path d="M48 100 L60 124 L72 100Z" fill="#fff"/>',hairc:'#4b2e1e'});
const WITNESS=person({body:'#C1784E',hairc:'#7a4b2a'});
const E=(s,size)=>`<span class="emo" style="font-size:${size||60}px">${s}</span>`;
const A=(cls,d,html,style='')=>`<div class="a ${cls}" style="--d:${d}s;${style}">${html}</div>`;
const swap=(o,oc,n,nc,d)=>`<span class="swap" style="--d:${d}s"><span class="old" style="background:${oc}">${o}</span><span class="new" style="background:${nc}">${n}</span></span>`;
const title=(no,col,t,s)=>`<div class="stitle a lft" style="--d:0s"><div class="no" style="background:${col}">${no}</div><h2>${t}</h2><small>${s||''}</small></div>`;

/* ===================== 장면 ===================== */
const STAGES=['수사','기소','공판','형 집행'];
const SC=[
/* 0 표지 */
{stage:-1,id:'cover',dur:0,html:()=>`
 <div class="lightL"></div><div class="lightR"></div>
 <div class="tape" style="top:120px;transform:rotate(-4deg)"><b>POLICE LINE · 출입 금지 · POLICE LINE</b></div>
 <div class="center" style="flex-direction:column;height:100%;position:relative;z-index:2;padding-top:40px">
   ${A('pop',.2,E('🚨',120),'')}
   ${A('up',.4,'<div class="ctitle">형사 절차의 흐름</div>')}
   ${A('up',.6,'<div class="csub">사건 발생부터 형 집행까지 · 피의자 → 피고인 → 수형자</div>')}
   ${A('up',.8,'<div class="csub" style="font-size:24px;opacity:.7">법과 사회 Ⅱ. 국가 생활과 법 · 03. 형법과 형사 절차</div>')}
   ${A('pop',1.1,'<button class="startbtn" onclick="go(1)">🚓 출동!</button>')}
 </div>
 <div class="tape" style="bottom:90px;transform:rotate(3deg)"><b>KEEP OUT · 수사 중 · KEEP OUT</b></div>`},
/* 1 수사 개시 */
{stage:0,dur:9,sfx:[[0,'siren'],[2300,'pop'],[4200,'stamp']],html:()=>`
 ${title(1,'var(--inv)','수사 개시','범죄가 의심되면 수사가 시작돼요')}
 <div class="row" style="align-items:center;gap:60px;margin-top:20px">
   <div style="text-align:center;width:330px">${A('lft',.3,`<div class="bob">${POLICE.replace('width="150"','width="220"')}</div>`)}
     ${A('up',.8,'<div class="tag" style="background:#2D4E8A;margin-top:10px">수사기관 (경찰·검사)</div>')}</div>

/* ===================== 진행 ===================== */
const stage=document.getElementById('stage'), sceneEl=document.getElementById('scene');
let cur=0, timers=[], auto=false, autoT=null, inQuiz=false;
function fit(){ const p=innerHeight>innerWidth; /* 세로 폰: 화면을 90도 돌려 꽉 채움 */ const s=p?Math.min(innerHeight/1600,innerWidth/900):Math.min(innerWidth/1600,innerHeight/900); const r=p?'90deg':'0deg'; stage.style.setProperty('--s',s); stage.style.setProperty('--r',r); stage.style.transform=`rotate(${r}) scale(${s})`; }
addEventListener('resize',fit); fit();
function drawTop(){
  const st=inQuiz?5:SC[cur].stage;
  let h=''; STAGES.forEach((n,i)=>{ h+=`<span class="chip c${i} ${i===st?'on':(st>i?'done':'')}">${n}</span>`+(i<3?'<span class="arrowchip">›</span>':''); });
  h+=`<div id="tools"><button class="tbtn ${auto?'act':''}" id="autoB" title="자동 재생 (A)">${auto?'⏸ 자동':'▶ 자동'}</button><button class="tbtn" id="muteB" title="소리 (M)">${muted?'🔇':'🔊'}</button><button class="tbtn" id="fsB" title="전체 화면 (F)">⛶</button><button class="tbtn" id="quizB">🎯 퀴즈</button></div>`;
  document.getElementById('top').innerHTML=h;
  document.getElementById('autoB').onclick=()=>{auto=!auto;drawTop();schedAuto();};
  document.getElementById('muteB').onclick=()=>{muted=!muted;drawTop();};
  document.getElementById('fsB').onclick=fs;
  document.getElementById('quizB').onclick=startQuiz;
  document.getElementById('top').style.display=(cur===0&&!inQuiz)?'none':'flex';
  document.getElementById('bar').style.width=inQuiz?'100%':(cur/(SC.length-1)*100)+'%';
}
function fs(){ if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{}); else document.exitFullscreen(); }
function clearT(){ timers.forEach(clearTimeout); timers=[]; clearTimeout(autoT); clearInterval(qInt); }
function go(i){
  ac(); clearT(); inQuiz=false; cur=Math.max(0,Math.min(SC.length-1,i)); const s=SC[cur];
  sceneEl.innerHTML=`<section class="scene" ${s.id?`id="${s.id}"`:''} style="${s.id?'padding:0':''}">${s.html()}</section>`;
  (s.sfx||[]).forEach(([t,n])=>timers.push(setTimeout(()=>sfx(n),t)));
  (s.shake||[]).forEach(t=>timers.push(setTimeout(shake,t)));
  if(cur===SC.length-1) timers.push(setTimeout(()=>confetti(80),4400));
  document.getElementById('pg').textContent=cur?`${cur} / ${SC.length-1}`:'';
  document.getElementById('nav').style.display=cur===0?'none':'flex';
  document.getElementById('next').textContent=cur===SC.length-1?'퀴즈 ▶':'다음 ▶';
  drawTop(); schedAuto();
}
function schedAuto(){ clearTimeout(autoT); if(auto&&!inQuiz&&SC[cur].dur) autoT=setTimeout(()=>go(cur+1),SC[cur].dur*1000); }
function shake(){ stage.classList.remove('shake'); void stage.offsetWidth; stage.classList.add('shake'); }
document.getElementById('next').onclick=()=>{ if(inQuiz) return; cur===SC.length-1?startQuiz():go(cur+1); };
document.getElementById('prev').onclick=()=>{ if(inQuiz) go(SC.length-1); else go(cur-1); };

/* ===================== 퀴즈 ===================== */
const QUIZ=[
 {ox:1,q:'수사는 피의자를 <span class="hl">구속한 상태</span>에서 하는 것이 원칙이다.',a:false,ex:'불구속 수사가 원칙! 구속은 꼭 필요할 때만 해요.'},
 {q:'체포·구속·압수·수색을 하려면 원칙적으로 <span class="hl">판사가 발부한 이것</span>이 있어야 한다. 무엇일까?',c:['영장','공소장','판결문','고소장'],a:0,ex:'영장주의 — 판사가 발부한 영장이 있어야 해요.'},
 {q:'구속된 피의자가 "구속이 부당해요! 다시 심사해 주세요!"라고 법원에 신청하는 제도는?',c:['구속 적부심 제도','피의자 심문 제도','형사 보상 제도','인정 신문'],a:0,ex:'구속 "후" 피의자가 신청 → 구속 적부심 / 구속 "전" 판사가 직접 물음 → 피의자 심문'},
 {q:'경찰이 수사해 보니 <span class="hl">혐의가 없다</span>고 판단했다. 경찰은 어떻게 할까?',c:['검찰에 불송치','검찰에 송치','법원에 기소','선고 유예'],a:0,ex:'혐의 없음 → 불송치. 다만 기록은 검사에게 보내 검사가 재수사를 요구할 수 있고, 고소인이 이의 신청하면 송치돼요. 혐의 있음 → 검찰에 송치.'},
 {q:'죄는 인정되지만 초범이고 깊이 반성해서 검사가 <span class="hl">재판에 넘기지 않기로</span> 했다. 이 처분은?',c:['기소 유예','집행 유예','선고 유예','공소권 없음'],a:0,ex:'기소 유예는 검사가! 집행 유예·선고 유예는 판사가! 헷갈리는 짝 주의!'},
 {q:'검사가 공소를 제기(기소)하면 피의자의 신분은 무엇으로 바뀔까?',c:['피고인','피해자','수형자','증인'],a:0,ex:'피의자 → (기소) → 피고인 → (실형 확정) → 수형자'},
 {q:'공판 절차의 순서로 옳은 것은?',c:['모두 → 심리 → 판결 선고','심리 → 모두 → 판결 선고','판결 선고 → 모두 → 심리','모두 → 판결 선고 → 심리'],a:0,ex:'모두 절차(진술 거부권 고지·인정 신문) → 심리 절차 → 판결 선고'},
 {ox:1,q:'<span class="hl">피고인만</span> 항소했다면, 2심 법원은 1심보다 더 무거운 형을 선고할 수 없다.',a:true,ex:'불이익 변경 금지의 원칙! 피고인이 겁먹지 않고 상소할 수 있게 해 줘요.'},
 {ox:1,q:'무죄 판결이 확정된 사건이라도 검사가 원하면 <span class="hl">같은 사건으로 다시</span> 처벌할 수 있다.',a:false,ex:'일사부재리의 원칙 — 판결이 확정된 사건은 다시 처벌하지 않아요.'},
 {q:'구속되어 재판을 받다가 <span class="hl">무죄 판결이 확정</span>되었다. 국가에 청구할 수 있는 것은?',c:['형사 보상','기소 유예','구속 적부심','항소'],a:0,ex:'형사 보상 제도! 명예 회복 제도로 무죄 판결을 알릴 수도 있어요.'}
];
const COLS=['#E5534B','#2F7DD1','#E8A317','#2BA36B'];
let qi=0,score=0,combo=0,locked=false,qInt=null,order=[],qTime=20,timerOn=true;
function startQuiz(){ ac(); clearT(); inQuiz=true; qi=0;score=0;combo=0; drawTop();
  document.getElementById('nav').style.display='flex'; document.getElementById('next').style.display='none'; document.getElementById('pg').textContent='';
  sceneEl.innerHTML=`<section class="scene" id="quiz" style="padding-top:110px"><div class="center" style="flex-direction:column;height:100%;color:#fff">
   ${A('pop',.1,E('🎯',140))}${A('up',.3,'<div style="font-size:90px;font-weight:900">형사 절차 퀴즈!</div>')}
   ${A('up',.5,`<div style="font-size:32px;opacity:.85;margin-top:12px">${QUIZ.length}문제 · 한 문제 ${qTime}초 · 연속으로 맞히면 콤보!</div>`)}
   ${A('pop',.8,'<button class="startbtn" id="qs">시작! 🚀</button>')}
   ${A('fade',1,`<label style="margin-top:28px;font-size:24px;opacity:.8;cursor:pointer"><input type="checkbox" id="tOn" ${timerOn?'checked':''} style="width:22px;height:22px;vertical-align:middle"> 시간 제한 켜기</label>`)}
  </div></section>`;
  sfx('fanfare');
  document.getElementById('qs').onclick=()=>{ timerOn=document.getElementById('tOn').checked; showQ(); };
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function showQ(){
  clearT(); locked=false; const q=QUIZ[qi]; sfx('whoosh');
  let body;
  if(q.ox){ body=`<div class="ox">${A('pop',.3,`<button class="ch" data-v="1" style="background:#2F7DD1">O</button>`)}${A('pop',.45,`<button class="ch" data-v="0" style="background:#E5534B">X</button>`)}</div>`; }
  else { order=shuffle(q.c.map((t,i)=>i)); body=`<div class="choices">${order.map((oi,k)=>A('pop',.3+k*.12,`<button class="ch" data-v="${oi}" style="background:${COLS[k]};width:100%"><span class="k">${k+1}</span>${q.c[oi]}</button>`)).join('')}</div>`; }
  sceneEl.innerHTML=`<section class="scene" id="quiz" style="padding:100px 80px 80px">
   <div class="qhead"><span class="qnum">Q${qi+1} / ${QUIZ.length}</span><span style="font-size:26px;opacity:.8">${q.ox?'O / X':'4지 선택'}</span><span class="combo" id="combo">${combo>=2?combo+' 콤보! 🔥':''}</span><span class="qscore">⭐ ${score}</span></div>
   ${A('up',0,`<div class="qcard"><div style="width:100%;word-break:keep-all">${q.q}</div></div>`)}
   ${timerOn?`<div class="timer"><i id="ti"></i></div>`:''}
   ${body}<div id="ex"></div></section>`;
  sceneEl.querySelectorAll('.ch').forEach(b=>b.onclick=()=>answer(b));
  if(timerOn){ let left=qTime*10; const ti=document.getElementById('ti');
    qInt=setInterval(()=>{ left--; ti.style.transform=`scaleX(${left/(qTime*10)})`; if(left<=50&&left%10===0) sfx('tick'); if(left<=0){ clearInterval(qInt); answer(null);} },100); }
}
function answer(btn){
  if(locked) return; locked=true; clearInterval(qInt); const q=QUIZ[qi];
  const correctV=q.ox?(q.a?'1':'0'):String(q.a); const ok=btn&&btn.dataset.v===correctV;
  sceneEl.querySelectorAll('.ch').forEach(b=>{ if(b.dataset.v===correctV) b.classList.add('right'); else if(b===btn) b.classList.add('wrong'); else b.classList.add('dim'); });
  const mk=document.createElement('div'); mk.className='bigmark'; mk.style.color=ok?'#5DD39E':'#E5534B'; mk.textContent=ok?'⭕':'❌'; stage.appendChild(mk); setTimeout(()=>mk.remove(),950);
  if(ok){ score++; combo++; sfx('ding'); if(combo>=2) setTimeout(()=>sfx('combo',combo),350); confetti(combo>=3?90:40); }
  else { combo=0; btn?sfx('sad'):(sfx('buzz')); shake(); }
  document.getElementById('combo').textContent=combo>=2?combo+' 콤보! 🔥':'';
  sceneEl.querySelector('.qscore').textContent='⭐ '+score;
  const ans=q.ox?(q.a?'O':'X'):q.c[q.a];
  document.getElementById('ex').innerHTML=A('up',.2,`<div class="expl ${ok?'ok':'no'}"><span class="emo" style="font-size:60px">${ok?'🎉':(btn?'😵':'⏰')}</span><div><b>${ok?'딩동댕!':(btn?'아쉬워요!':'시간 끝!')}</b> 정답은 <b>${ans}</b><br><span style="font-weight:600">${q.ex}</span></div>
   <button class="startbtn" style="margin:0 0 0 auto;font-size:30px;padding:14px 30px;animation:none;flex:none" id="nq">${qi<QUIZ.length-1?'다음 문제 ▶':'결과 보기 🏆'}</button></div>`);
  document.getElementById('nq').onclick=nextQ;
}
function nextQ(){ if(qi<QUIZ.length-1){ qi++; showQ(); } else result(); }
function result(){
  clearT(); const n=QUIZ.length, r=score/n;
  const [emo,ttl,msg]= r===1?['👑','명판사 등극!','형사 절차를 완벽하게 꿰뚫었어요!']: r>=.8?['⚖️','에이스 변호사','거의 다 왔어요! 틀린 것만 다시 확인!']: r>=.5?['🔍','성실한 수사관','흐름은 잡았어요. 헷갈리는 짝을 다시 보자!']:['📚','수습 법조인','정리 화면을 다시 보고 재도전!'];
  sceneEl.innerHTML=`<section class="scene" id="quiz"><div class="result center" style="flex-direction:column;height:100%">
   ${A('pop',.2,E(emo,170))}${A('up',.5,`<div style="font-size:96px;font-weight:900">${score} / ${n}</div>`)}
   ${A('up',.8,`<div style="font-size:60px;font-weight:900;color:var(--gold)">${ttl}</div>`)}${A('up',1,`<div style="font-size:32px;margin-top:10px;opacity:.9">${msg}</div>`)}
   ${A('pop',1.3,`<div style="display:flex;gap:20px;margin-top:40px"><button class="startbtn" style="animation:none" onclick="startQuiz()">🔁 다시 도전</button><button class="startbtn" style="animation:none;background:#fff" onclick="go(${SC.length-1})">📋 정리 보기</button><button class="startbtn" style="animation:none;background:#fff" onclick="go(1)">🎬 처음부터</button></div>`)}
  </div></section>`;
  r>=.5?(sfx('cheer'),confetti(220)):sfx('boing');
}

/* ===================== 꽃가루 ===================== */
const cv=document.getElementById('fx'),cx=cv.getContext('2d'); let parts=[],raf=null;
function confetti(n){ for(let i=0;i<n;i++) parts.push({x:800+(Math.random()-.5)*400,y:450,vx:(Math.random()-.5)*26,vy:-Math.random()*22-6,r:Math.random()*360,vr:(Math.random()-.5)*20,w:10+Math.random()*10,h:6+Math.random()*8,c:['#E5534B','#2F7DD1','#F2B705','#2BA36B','#E8913A','#9b59b6'][i%6],life:0});
  if(!raf) loop(); }
function loop(){ cx.clearRect(0,0,1600,900); parts=parts.filter(p=>p.y<950&&p.life<240);
  parts.forEach(p=>{p.vy+=.5;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life++;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r*Math.PI/180);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore();});
  raf=parts.length?requestAnimationFrame(loop):null; if(!raf) cx.clearRect(0,0,1600,900); }

/* ===================== 키보드 ===================== */
addEventListener('keydown',e=>{
  const k=e.key;
  if(k==='f'||k==='F'){fs();return;} if(k==='m'||k==='M'){muted=!muted;drawTop();return;}
  if(inQuiz){
    const btns=[...sceneEl.querySelectorAll('.ch')];
    if(!locked&&btns.length){ const q=QUIZ[qi];
      if(q.ox){ if(k==='o'||k==='O'||k==='1') answer(btns[0]); if(k==='x'||k==='X'||k==='2') answer(btns[1]); }
      else if(k>='1'&&k<='4') answer(btns[+k-1]); }
    else if((k==='Enter'||k===' '||k==='ArrowRight')&&document.getElementById('nq')) { e.preventDefault(); nextQ(); }
    else if((k===' '||k==='Enter')&&document.getElementById('qs')) { e.preventDefault(); document.getElementById('qs').click(); }
    return;
  }
  if(k==='a'||k==='A'){auto=!auto;drawTop();schedAuto();return;}
  if(k==='ArrowRight'||k===' '||k==='PageDown'||k==='Enter'){ e.preventDefault(); cur===SC.length-1?startQuiz():go(cur+1); }
  if(k==='ArrowLeft'||k==='PageUp') go(cur-1);
});
go(0);
