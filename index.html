<style>

  .hs::before { content:''; position:absolute; left:50%; top:38%; width:70px; height:70px; margin:-35px 0 0 -35px; border-radius:50%; border:3px solid rgba(243,201,168,.8); animation:ring 1.6s infinite; pointer-events:none; }
  .hs.dim { opacity:.35; } .hs.dim::before { display:none; }

  @keyframes ring { 0% { transform:scale(.6); opacity:1; } 100% { transform:scale(1.4); opacity:0; } }
  .hero { position:absolute; width:9.5%; z-index:4; transform:translate(-50%,-100%); transition-property:left,top; transition-timing-function:linear; pointer-events:none; }
  .hero svg { width:100%; display:block; }

  @keyframes bob { 50% { transform:translateY(-6%) rotate(-3deg); } }
  @keyframes bobf { 0%,100% { transform:scaleX(-1); } 50% { transform:scaleX(-1) translateY(-6%) rotate(-3deg); } }
  @keyframes shake { 25% { transform:translateX(-8%); } 75% { transform:translateX(8%); } }
  #door { transform-box:fill-box; transform-origin:left center; transition:transform .9s ease-in; }
  .open #door { transform:scaleX(.12); }
  .blinkR { animation:blink .7s infinite; } .blinkB { animation:blink .7s infinite .35s; }
  .lampglow { animation:flick 3s infinite; } @keyframes flick { 0%,100% { opacity:.55; } 47% { opacity:.55; } 50% { opacity:.25; } 53% { opacity:.6; } }

  .tag { display:inline-block; background:var(--accent); color:#fff; border-radius:999px; padding:5px 14px; font-size:14px; font-weight:800; }

  .btn.warm { background:linear-gradient(#D9925F,#A9603A); box-shadow:0 6px 18px rgba(193,122,84,.45); }

  .hint { background:var(--soft); border-radius:12px; padding:14px 16px; font-size:17px; line-height:1.6; }

  .seq { display:flex; flex-wrap:wrap; gap:8px; margin:10px 0; min-height:44px; }
  .chip { background:var(--accent); color:#fff; border-radius:999px; padding:8px 14px; font-size:16px; font-weight:800; }
  .center { text-align:center; } .big { font-size:62px; line-height:1.1; }
  table.res { width:100%; border-collapse:collapse; font-size:18px; margin-top:10px; } table.res td { border-bottom:1px solid #E5E7EB; padding:9px 6px; }
  /* 첫 화면 */
  .title-card { background:linear-gradient(160deg,#1E2231,#11131B); border:1px solid #333A50; border-radius:22px; padding:26px 22px; text-align:center; box-shadow:0 12px 40px rgba(0,0,0,.6); }
  .title-card h1 { font-size:clamp(34px,7vw,56px); margin:6px 0; letter-spacing:-1px; text-shadow:0 4px 24px rgba(243,201,168,.35); }
  .title-card .sub { color:var(--gold); font-weight:800; }

  .av { width:86px; padding:6px; border-radius:16px; border:3px solid transparent; background:#262B3D; cursor:pointer; }
  .av.on { border-color:var(--gold); background:#33394F; }
  .team { font-family:inherit; font-size:20px; width:min(420px,100%); padding:12px; border-radius:14px; border:2px solid #3A4157; background:#0E1018; color:#fff; text-align:center; }
  .lock { position:fixed; inset:0; background:rgba(14,16,24,.88); color:#fff; display:none; align-items:center; justify-content:center; flex-direction:column; font-size:23px; font-weight:900; z-index:40; text-align:center; padding:20px; }
  .toast { position:fixed; left:50%; top:18%; transform:translateX(-50%); z-index:30; background:rgba(14,16,24,.92); border:2px solid var(--gold); color:#fff; padding:14px 22px; border-radius:16px; font-size:20px; font-weight:900; animation:pop .3s; }

  .flykey { position:fixed; z-index:35; font-size:54px; transition:all .9s cubic-bezier(.5,-0.3,.6,1); pointer-events:none; }

  .teams { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin:8px 0 14px; }
  .tm { font-family:inherit; font-size:20px; font-weight:900; padding:14px 18px; min-width:120px; border-radius:14px; border:2px solid #3A4157; background:#262B3D; color:#fff; cursor:pointer; }
  .cases { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin:12px 0; }

  .case.ok { border:2px solid #2E8B57; background:#16301F; }
  .case .no { font-size:13px; color:#9AA3B5; font-weight:800; } .case .em { font-size:34px; } .case .nm { font-size:14px; font-weight:800; } .case .cl { font-size:13px; color:#D5DBE6; } .case .cl b { color:#F3C9A8; font-size:16px; }
  @media (max-width:600px) { .cases { grid-template-columns:repeat(2,1fr); } }
  .cluebox { background:#14161F; color:#fff; border-radius:16px; padding:14px; margin:10px auto; max-width:360px; }
  .clueword { font-size:46px; font-weight:900; color:#F3C9A8; letter-spacing:4px; }
  .oxrow { display:flex; align-items:center; gap:8px; border:2px solid #D9DEE7; border-radius:14px; padding:10px 12px; }
  .oxt { flex:1; font-size:17px; line-height:1.5; }
  .ox { width:54px; height:48px; border-radius:12px; border:2px solid #D9DEE7; background:#fff; font-size:22px; font-weight:900; cursor:pointer; }
  .ox.on { background:#3E5C87; color:#fff; border-color:#3E5C87; }
  .final { font-size:20px; line-height:2.3; }
  .blank { font-family:inherit; font-size:18px; font-weight:900; min-width:90px; padding:4px 10px; border:0; border-bottom:3px solid #C17A54; background:#F8EEE6; border-radius:8px; cursor:pointer; color:#14161F; }
  .blank.on { outline:3px solid #3E5C87; } .blank.filled { color:#3E5C87; }
  .bank { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0; }
  .word { font-family:inherit; font-size:18px; font-weight:800; padding:10px 14px; border-radius:999px; border:2px solid #3E5C87; background:#EEF2F7; color:#14161F; cursor:pointer; }
  .btn:disabled { background:#5B6275; box-shadow:none; }
  label { display:block; margin:10px 0; font-weight:800; } label .team, label input { display:block; margin-top:6px; }
  .names { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:8px; } .trow { display:flex; gap:6px; align-items:center; } .trow .tnm { flex:1; width:auto; } .trow .tsz { width:70px; padding:12px 4px; }
  body.wide #app { max-width:1800px; }

  table.bt { width:100%; border-collapse:separate; border-spacing:4px; font-size:22px; }
  .bt th { color:#9AA3B5; font-size:18px; } .bt td { background:#1E2231; border-radius:8px; height:52px; text-align:center; font-weight:900; }
  .bt td.ok { background:#2E8B57; } .bt td.fin { background:#C17A54; } .bt td.tn { text-align:left; padding:0 14px; white-space:nowrap; } .bt td.tn small { color:#9AA3B5; font-size:15px; }
  .bfoot { color:#9AA3B5; text-align:center; font-size:18px; }

<script>

const API = 'https://script.google.com/macros/s/AKfycbxIPsuikM78pev-9ikc012NWqH4ZCWkV0RXZzU3u_5JVKug8sRkk9av-bpGNEnSu7w/exec';
const LOCK_SEC = 10;
const DEFAULT_TEAMS = ['1모둠', '2모둠', '3모둠', '4모둠', '5모둠', '6모둠', '7모둠', '8모둠'];
const HINT_SPOT = [90, 84];

// ---------------------------------------------------------------- 증거물 10개 (교과서 72~81쪽, 인물은 허구)
const QS = {
  1: { item: '체포 보고서', em: '📄', scene: 0, spot: [50, 62], page: '교과서 80쪽', clue: '미란다', type: 'find',
    story: '밤 9시, 편의점 앞. 경찰관 두 명이 한결(고2, 가상 인물)에게 다가왔다. "편의점 절도 신고가 들어왔다."',
    record: ['오후 9:02 신고 접수: 편의점에서 이어폰 1개 도난', '오후 9:10 경찰관이 한결에게 다가가 신분증을 요구함', '오후 9:11 경찰관이 아무 설명 없이 한결에게 수갑을 채우고 순찰차에 태움', '오후 9:30 경찰서 도착, 한결의 부모에게 연락함'], bad: 2,
    q: '이 장면에서 경찰이 지키지 않은 것은?',
    opts: ['미란다 원칙 — 체포할 때 진술 거부권과 변호인을 선임할 수 있다는 것을 알려야 함', '공개 재판주의 — 재판은 공개해야 함', '불이익 변경 금지 — 피고인만 항소하면 더 무거운 형을 줄 수 없음', '일사부재리 — 확정된 사건은 다시 재판하지 않음'], ans: 0,
    hint: '체포할 때 수사 기관이 "미리 알려 줄 의무"가 있는 권리가 있어요. 「형사 소송법」 제244조의3.',
    learn: '<b>미란다 원칙</b>: 수사 기관은 피의자를 체포하거나 신문할 때 진술 거부권, 변호인의 조력을 받을 권리 등을 미리 알려야 한다.' },
  2: { item: '조사실 녹취록', em: '📼', scene: 1, spot: [50, 56], page: '교과서 80쪽', clue: '자백', type: 'find',
    story: '경찰서 조사실. 한결은 계속 "훔치지 않았다"고 말했지만, 조사는 새벽까지 이어졌다.',
    record: ['오후 10:00 조사 시작, 한결은 혐의를 부인함', '오전 1:00 형사가 "자백하면 바로 집에 보내 주겠다"고 함', '오전 3:30 지친 한결이 "제가 했어요"라고 진술서를 씀', '오전 9:00 한결의 부모가 변호사와 함께 경찰서에 도착함'], bad: 1,
    q: '이렇게 받아 낸 자백이 "유일한 증거"라면 재판에서는?',
    opts: ['자백했으니 그것만으로 유죄를 선고할 수 있다', '피고인의 자백만이 유일한 증거이면 유죄의 증거로 삼을 수 없다', '경찰이 받은 자백이므로 판사는 반드시 따라야 한다', '자백은 언제나 무효이므로 재판을 열 수 없다'], ans: 1,
    hint: '증거 재판주의를 떠올려 보세요. 자백 하나만 있을 때는 어떻게 될까요?',
    learn: '<b>진술 거부권</b>: 자신에게 불리한 진술을 거부할 수 있다. 증거 재판주의에 따라 <b>자백만이 유일한 증거이면 유죄의 증거로 삼지 않는다</b>.' },
  3: { item: '압수 목록', em: '📋', scene: 2, spot: [60, 48], page: '교과서 80쪽', clue: '영장', type: 'find',
    story: '다음 날 아침, 수사관들이 증거를 찾겠다며 한결의 집으로 갔다.',

    q: '이 휴대폰 사진은 재판에서 유죄의 증거가 될 수 있을까?',

function hud() {
  const left = CFG.limitMin * 60 - elapsedSec(); const n = Object.keys(teamSolved()).length;
  return `<div class="hud"><div class="info">👥 <b>${esc(tName(S.team))}</b> · ⏱ <b id="clock" class="clock ${left < 300 ? 'danger' : ''}">${fmt(left)}</b> · 🗝️ <b>${n}</b>/10</div>
    <div class="right"><button class="icon-btn" id="home" aria-label="수사 현황">🗂️</button><button class="icon-btn" id="snd" aria-label="소리">${Snd.on ? '🔊' : '🔇'}</button></div></div>`;
}
function wireHud() {
  const b = document.getElementById('snd'); if (b) b.onclick = () => { Snd.toggle(); b.textContent = Snd.on ? '🔊' : '🔇'; };
  const h = document.getElementById('home'); if (h) h.onclick = () => { history.replaceState(null, '', location.pathname); home(); };
}
function lock(text) { S.wrong++; S.lockUntil = Date.now() + LOCK_SEC * 1000; S.lockText = text; save(); Snd.sfx('bad'); report('wrong'); showLock(); }
let lockTimer = null;
function showLock() {
  const L = document.getElementById('lock'); clearInterval(lockTimer);
  const tick = () => {
    const n = Math.ceil((S.lockUntil - Date.now()) / 1000);
    if (n <= 0) { L.style.display = 'none'; clearInterval(lockTimer); return; }
    L.style.display = 'flex';
    document.getElementById('lockText').innerHTML = `${esc(S.lockText)}<br>${n}초 뒤에 다시 도전!<br><span style="font-size:16px;font-weight:600">모둠원과 근거를 먼저 이야기해 보세요.</span>`;
  };
  tick(); lockTimer = setInterval(tick, 250);
}
function toast(t, ms = 1600) { const el = $(`<div class="toast">${t}</div>`); document.body.append(el); setTimeout(() => el.remove(), ms); }
function sheet(html, closable = true) {
  closeSheet();
  const sh = $(`<div class="sheet" id="sheet"><div class="card">${closable ? '<button class="x" id="sx" aria-label="닫기">✕</button>' : ''}${html}</div></div>`);
  document.body.append(sh);
  if (closable) { sh.querySelector('#sx').onclick = closeSheet; sh.onclick = (e) => { if (e.target === sh) closeSheet(); }; }
  return sh.querySelector('.card');
}
function closeSheet() { const s = document.getElementById('sheet'); if (s) s.remove(); }
let heroPos = [10, 84], walking = false;
function walkTo(stage, x, y, cb) {
  if (walking) return; walking = true;
  const h = stage.querySelector('.hero'); const dx = x - heroPos[0], dy = y - heroPos[1];
  const ms = Math.min(1500, Math.max(250, Math.hypot(dx, dy) * 22));
  h.classList.toggle('flip', dx < 0); h.classList.add('walk');
  h.style.transitionDuration = ms + 'ms'; h.style.left = x + '%'; h.style.top = y + '%'; heroPos = [x, y];
  let n = 0; const st = setInterval(() => { if (n++ * 320 < ms) Snd.sfx('step'); else clearInterval(st); }, 320);
  setTimeout(() => { h.classList.remove('walk'); walking = false; if (cb) cb(); }, ms + 30);
}
const feet = (x, y) => [Math.max(x - 8, 5), Math.min(y + 14, 90)];
const talk = (who, name, text) => `<div class="talk"><div class="who">${who}</div><div><div class="nm">${name}</div><div class="txt">${text}</div></div></div>`;
function stageHTML(sceneIdx, title) {
  return `<div class="stage"><svg class="scene" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">${SCENES[sceneIdx]()}</svg>
    <div class="room-title">${title}</div><div class="hero" style="left:10%;top:84%">${heroSVG(S.avatar)}</div><div class="fade"></div></div>`;
}
function addSpot(stage, key, [x, y], em, lb, cls, fn) {
  const b = $(`<button class="hs ${cls || ''}" data-hs="${key}" style="left:${x}%;top:${y}%"><span class="em">${em}</span><span class="lb">${lb}</span></button>`);
  b.onclick = () => { if (walking || document.getElementById('sheet')) return; walkTo(stage, ...feet(x, y), fn); };
  stage.append(b); return b;
}

// ---------------------------------------------------------------- 증거물 QR
function station(no) {
  viewingHome = false;
  const Q = QS[no]; closeSheet();
  if (!Q) return home();
  if (S.end) return finish();
  if (teamSolved()[no]) { home(); toast(`✅ 증거물 ${no}은 이미 해결했어요 (단서: ${Q.clue})`, 2200); return; }
  app.innerHTML = hud();
  const stage = $(stageHTML(Q.scene, `증거물 ${no} · ${Q.item}`)); app.append(stage); wireHud(); heroPos = [10, 84];
  app.append($(`<div>${talk('🧑‍💼', `증거물 ${no} · ${Q.item}`, `${Q.story}<br><b>👉 ${Q.em} ${Q.item}</b>를 터치해 조사하세요.`)}</div>`));
  addSpot(stage, 'item', Q.spot, Q.em, Q.item, '', () => puzzle(no));
  addSpot(stage, 'clue', HINT_SPOT, '📘', '교과서 단서', S.usedHint[no] ? 'done' : '', () => hintSheet(no));
}
function hintSheet(no) {
  const Q = QS[no];
  if (!S.usedHint[no]) {
    if (!confirm('힌트를 쓸까요? 쓴 힌트는 대시보드에 기록돼요.')) return;
    S.hints++; S.usedHint[no] = true; save(); report('hint', no);
    const c = document.querySelector('[data-hs="clue"]'); if (c) c.classList.add('done');
  }
  sheet(`<span class="tag">📘 교과서 단서</span><span class="page-ref">${Q.page}</span><div class="hint" style="margin-top:12px">${Q.hint}</div>`);
}
function puzzle(no) {
  const Q = QS[no]; const step = S.step[no] || 0;
  const card = sheet(`<span class="tag">증거물 ${no} · ${Q.item}</span><span class="page-ref">${Q.page}</span><div id="area"></div>`);
  const area = card.querySelector('#area');
  const choices = (box, opts, ans, onOk) => shuffle(opts.map((o, i) => i)).forEach((i, k) => {
    const b = $(`<button class="opt">${String.fromCharCode(9312 + k)} ${opts[i]}</button>`);
    b.onclick = () => { if (i === ans) onOk(); else { b.classList.add('bad'); lock('다시 생각해 보세요.'); setTimeout(() => b.classList.remove('bad'), 1200); } };
    box.append(b);
  });
  if (Q.type === 'find' && step === 0) {
    area.append($('<p class="q">① 기록에서 <u>위법한 절차</u>가 적힌 줄을 터치하세요.</p>'));
    const rec = $(`<div class="record"><div class="head">📄 ${Q.item} — 한결 사건</div></div>`);
    Q.record.forEach((line, i) => { const b = $(`<button class="opt">${line}</button>`);
      b.onclick = () => { if (i === Q.bad) { S.step[no] = 1; save(); Snd.sfx('ok'); b.classList.add('done'); setTimeout(() => puzzle(no), 500); } else { b.classList.add('bad'); lock('그 줄은 적법한 절차예요.'); setTimeout(() => b.classList.remove('bad'), 1200); } };
      rec.append(b); });
    area.append(rec); return;
  }
  if (Q.type === 'find') area.append($(`<div class="record" style="margin-bottom:12px"><div class="head">✅ 찾아낸 위법</div><div class="opt done" style="cursor:default">${Q.record[Q.bad]}</div></div>`));
  area.append($(`<p class="q">${Q.type === 'find' ? '② ' : ''}${Q.q}</p>`));
  if (Q.type === 'find' || Q.type === 'choice') { const box = $('<div class="opts"></div>'); area.append(box); choices(box, Q.opts, Q.ans, () => solve(no)); return; }
  if (Q.type === 'order') {
    const seq = $('<div class="seq"></div>'), box = $('<div class="opts"></div>'); area.append(seq); area.append(box); let picked = [];
    shuffle(Q.steps).forEach((s) => { const b = $(`<button class="opt">${s}</button>`);
      b.onclick = () => { if (picked.includes(s)) return;
        if (s !== Q.steps[picked.length]) { picked = []; seq.innerHTML = ''; box.querySelectorAll('.opt').forEach((x) => x.classList.remove('sel')); lock('순서가 틀렸어요. 처음부터!'); return; }
        picked.push(s); b.classList.add('sel'); seq.append($(`<span class="chip">${picked.length}. ${s}</span>`)); Snd.sfx('step');
        if (picked.length === Q.steps.length) setTimeout(() => solve(no), 500); };
      box.append(b); });
    return;
  }
  if (Q.type === 'ox') {
    const pick = {}; const box = $('<div class="opts"></div>'); area.append(box);
    Q.items.forEach(([t], i) => { const row = $(`<div class="oxrow"><div class="oxt">${i + 1}. ${t}</div><button class="ox" data-v="1">O</button><button class="ox" data-v="0">X</button></div>`);
      row.querySelectorAll('.ox').forEach((b) => { b.onclick = () => { pick[i] = b.dataset.v === '1'; row.querySelectorAll('.ox').forEach((x) => x.classList.toggle('on', x === b)); }; });
      box.append(row); });
    const go = $('<div class="center"><button class="btn warm">확인</button></div>'); area.append(go);
    go.querySelector('button').onclick = () => {
      if (Object.keys(pick).length < Q.items.length) { toast('세 문장 모두 O/X를 골라 주세요'); return; }
      if (Q.items.every(([, v], i) => pick[i] === v)) solve(no); else lock('틀린 문장이 있어요.');
    };
  }
}
function solve(no) {
  const Q = QS[no];
  S.solved[no] = Date.now(); save(); report('solve', no); Snd.sfx('key');
  const n = Object.keys(teamSolved()).length;
  const card = sheet(`<div class="center"><div class="big">🗝️</div><h2>증거물 ${no} 해결!</h2>
    <div class="cluebox"><div style="font-size:15px;color:#6B7280">수사 기록지 ${no}번 칸에 적으세요</div><div class="clueword">${Q.clue}</div></div></div>
    <div class="learn">${Q.learn}</div>
    <p class="center" style="font-size:16px;color:#6B7280">우리 모둠 ${n} / 10 해결 ${n >= 10 ? '— 최종 변론 법정이 열렸어요!' : '— 다음 증거물 QR을 찾아라!'}</p>
    <div class="center"><button class="btn" id="ok">수사 현황 보기</button></div>`, false);
  card.querySelector('#ok').onclick = () => { history.replaceState(null, '', location.pathname); home(); };
}

// ---------------------------------------------------------------- 최종 변론 법정
function finalCourt() {
  viewingHome = false;
  if (Object.keys(teamSolved()).length < 10) return home();
  app.innerHTML = hud();
  const stage = $(stageHTML(4, '최종 변론 법정')); app.append(stage); wireHud();
  app.append($(`<div>${talk('🧑‍💼', '최종 변론', '재판부 앞에서 변론문을 완성하자! 빈칸을 누르고, 아래 단서 단어를 눌러 채우세요.')}</div>`));
  const blanks = FINAL.map((p, i) => (i % 2 ? `<button class="blank" data-i="${i}">　　　</button>` : esc(p))).join('');
  const card = $(`<div class="card" style="background:#fff;color:#14161F;border-radius:18px;padding:18px;margin-top:10px">
    <p class="q" style="margin-top:0">📜 최종 변론문</p><p class="final">${blanks}</p>
    <div class="bank">${shuffle(Object.values(QS).map((q) => q.clue)).map((w) => `<button class="word">${w}</button>`).join('')}</div>
    <div class="center"><button class="btn warm" id="judge">⚖️ 변론 마치고 판결 받기</button></div></div>`);
  app.append(card);
  let sel = null; const fill = {};
  card.querySelectorAll('.blank').forEach((b) => { b.onclick = () => { sel = b; card.querySelectorAll('.blank').forEach((x) => x.classList.toggle('on', x === b)); }; });
  card.querySelectorAll('.word').forEach((w) => { w.onclick = () => {
    if (!sel) { sel = card.querySelector('.blank:not(.filled)') || card.querySelector('.blank'); }
    fill[sel.dataset.i] = w.textContent; sel.textContent = w.textContent; sel.classList.add('filled'); Snd.sfx('step');
    sel = card.querySelector('.blank:not(.filled)'); card.querySelectorAll('.blank').forEach((x) => x.classList.toggle('on', x === sel));
  }; });
  card.querySelector('#judge').onclick = () => {
    const idx = FINAL.map((p, i) => i).filter((i) => i % 2);
    if (idx.some((i) => !fill[i])) { toast('빈칸 5개를 모두 채워 주세요'); return; }
    if (idx.every((i) => fill[i] === FINAL[i])) { S.end = Date.now(); save(); report('final'); Snd.sfx('win'); Snd.stopMusic(); finish(); }
    else lock('재판부: "변론에 맞지 않는 단어가 있습니다."');
  };
}
function finish() {
  viewingHome = false;
  closeSheet(); app.innerHTML = '';
  const late = S.end - startAt() > CFG.limitMin * 60 * 1000; const t = elapsedSec();
  const c = $(`<div class="title-card"><div style="width:120px;margin:0 auto">${heroSVG(S.avatar)}</div>
    <h1>${late ? '시간 초과 탈출' : '무죄 판결! 탈출 성공!'}</h1>
    <p>재판부: "위법하게 모은 증거와 강요된 자백은 증거가 될 수 없고, 고의도 없었다. 피고인 한결은 <b>무죄</b>."</p>
    <div class="card" style="background:#fff;color:#14161F;border-radius:16px;padding:6px 14px"><table class="res">
      <tr><td>👥 모둠</td><td><b>${esc(tLabel(S.team))}</b></td></tr>
      <tr><td>⏱ 걸린 시간</td><td><b>${fmt(t)}</b> ${late ? '(시간 초과)' : ''}</td></tr>
      <tr><td>💡 이 기기에서 쓴 힌트</td><td><b>${S.hints}</b>개</td></tr><tr><td>❌ 이 기기에서 틀린 횟수</td><td><b>${S.wrong}</b>번</td></tr></table></div>
    <p style="font-size:16px">대시보드에서 우리 모둠 순위를 확인하세요. 무죄로 풀려난 한결은 <b>형사 보상</b>을 청구할 수 있어요!</p></div>`);
  app.append(c);
}

// ---------------------------------------------------------------- 대시보드 (?board, 칠판 TV용)
async function board() {
  document.body.classList.add('wide');
  const draw = (b) => {
    if (!b) { app.innerHTML = `<div class="title-card"><h1>대시보드</h1><p>${API ? '서버에 연결하지 못했어요. 잠시 뒤 다시 시도합니다.' : '서버 주소(API)가 아직 없어요. 앱스크립트를 배포한 뒤 주소를 넣어 주세요.'}</p></div>`; return; }
    const lim = b.limitMin * 60 * 1000; const start = b.start; const now = b.now || Date.now();
    const left = start ? Math.round((start + lim - now) / 1000) : null;
    const rows = b.teams.map((t) => { const p = b.progress[t] || { solved: {}, hints: 0, wrong: 0, final: 0 }; return { t, p, n: Object.keys(p.solved).length }; });
    const ranked = rows.filter((r) => r.p.final).sort((x, y) => x.p.final - y.p.final).map((r) => r.t);
    const medal = (t) => ['🥇', '🥈', '🥉'][ranked.indexOf(t)] || (ranked.includes(t) ? '🏁' : '');
    app.innerHTML = `<div class="board"><div class="bhead"><div><span class="sub">억울한 피의자를 구하라 · 실시간 수사 현황</span><h1>${esc(b.cls || '우리 반')}</h1></div>
      <div class="bclock ${left !== null && left < 300 ? 'danger' : ''}">${left === null ? '시작 전' : '⏱ ' + fmt(left)}</div></div>
      <table class="bt"><tr><th>모둠</th>${Object.keys(QS).map((k) => `<th>${k}</th>`).join('')}<th>변론</th><th>💡</th><th>❌</th></tr>
      ${rows.map(({ t, p, n }) => `<tr><td class="tn">${medal(t)} ${esc(tName(t))} <small>${tSize(t) ? '👤' + tSize(t) + ' · ' : ''}${n}/10</small></td>${Object.keys(QS).map((k) => `<td class="${p.solved[k] ? 'ok' : ''}">${p.solved[k] ? '✔' : ''}</td>`).join('')}
        <td class="${p.final ? 'fin' : ''}">${p.final ? fmt(Math.round((p.final - (start || p.final)) / 1000)) : ''}</td><td>${p.hints}</td><td>${p.wrong}</td></tr>`).join('')}</table>
      <p class="bfoot">QR을 찍어 증거물을 조사하세요 · 5초마다 새로 고침</p></div>`;
  };
  const tick = async () => draw(await apiGet('board'));
  await tick(); setInterval(tick, 5000);
}

// ---------------------------------------------------------------- 선생님 설정 (?teacher)
async function teacher() {
  const b = await apiGet('board');
  app.innerHTML = '';
  const c = $(`<div class="title-card" style="text-align:left"><div class="sub">선생님 설정</div><h1 style="font-size:32px">반 만들기 · 모둠 정하기</h1>
    <p>${API ? (b ? `서버 연결됨 ✅ · 지금 반: <b>${esc(b.cls || '없음')}</b> (${(b.teams || []).length}모둠: ${(b.teams || []).map((t) => esc(tLabel(t))).join(', ')})` : '서버에 연결하지 못했어요 ❌') : '서버 주소가 없어 이 기능을 쓸 수 없어요.'}</p>
    <label>비밀번호(처음 입력한 값이 선생님 비밀번호가 됩니다)<input class="team" id="pin" type="password"></label>
    <label>반 이름<input class="team" id="cls" placeholder="예: 2학년 3반"></label>
    <label>모둠 수 <input class="team" id="cnt" type="number" min="1" max="20" value="6" style="width:120px"></label>
    <label>기본 모둠 인원(명) — 아래에서 모둠마다 따로 바꿀 수 있어요 <input class="team" id="size" type="number" min="1" max="12" value="4" style="width:120px"></label>
    <div id="names" class="names"></div>
    <label>제한 시간(분)<input class="team" id="lim" type="number" min="5" max="120" value="25" style="width:120px"></label>
    <div><button class="btn warm" id="mk">새 반 시작 (기록 초기화)</button> <button class="btn" id="go">⏱ 지금 타이머 시작</button></div>
    <p id="msg" style="font-weight:800"></p>
    <p style="font-size:15px">대시보드: <a style="color:#F3C9A8" href="?board">이 주소 뒤에 ?board</a> · 학생 기기는 새 반을 시작하면 QR을 찍을 때 모둠을 다시 고릅니다.</p></div>`);
  app.append(c);
  const names = c.querySelector('#names');
  const drawNames = (resetSize) => {
    const n = Math.max(1, Math.min(20, +c.querySelector('#cnt').value || 1)); const def = Math.max(1, +c.querySelector('#size').value || 4);
    const old = [...names.querySelectorAll('.trow')].map((r) => [r.querySelector('.tnm').value, r.querySelector('.tsz').value]);
    names.innerHTML = Array.from({ length: n }, (_, i) => `<div class="trow"><input class="team tnm" value="${esc((old[i] && old[i][0]) || (i + 1) + '모둠')}" maxlength="15">
      <input class="team tsz" type="number" min="1" max="12" value="${resetSize || !old[i] ? def : old[i][1]}"><span>명</span></div>`).join('');
  };
  c.querySelector('#cnt').oninput = () => drawNames(false); c.querySelector('#size').oninput = () => drawNames(true); drawNames(true);
  const post = async (body) => { try { const r = await fetch(API, { method: 'POST', body: JSON.stringify(body) }); return await r.json(); } catch { return { ok: false, error: '연결 실패' }; } };
  const msg = (t) => { c.querySelector('#msg').textContent = t; };
  c.querySelector('#mk').onclick = async () => {
    if (!confirm('새 반을 시작하면 지금 대시보드 기록이 모두 지워져요. 계속할까요?')) return;
    const r = await post({ a: 'setup', pin: c.querySelector('#pin').value, cls: c.querySelector('#cls').value, limitMin: +c.querySelector('#lim').value,
      teams: [...names.querySelectorAll('.trow')].map((r) => r.querySelector('.tnm').value.replace(/\|/g, ' ').trim() + '|' + Math.max(1, +r.querySelector('.tsz').value || 1)) });
    msg(r.ok ? '✅ 새 반을 만들었어요. 수업을 시작할 때 "지금 타이머 시작"을 누르세요.' : '❌ ' + r.error);
  };
  c.querySelector('#go').onclick = async () => { const r = await post({ a: 'start', pin: c.querySelector('#pin').value }); msg(r.ok ? '⏱ 타이머를 시작했어요!' : '❌ ' + r.error); };
}

// ---------------------------------------------------------------- 시작
setInterval(() => {
  const el = document.getElementById('clock'); if (!el || S.end) return;
  const left = CFG.limitMin * 60 - elapsedSec();
  el.textContent = fmt(left); el.classList.toggle('danger', left < 300);
  Snd.tempo = left < 300 ? 118 : 92;
}, 1000);
setInterval(async () => { // 같은 모둠 다른 기기가 푼 것도 반영
  if (!API || params.has('board') || params.has('teacher') || !S.team) return;
  const b = await apiGet('board');
  if (b && b.ok && b.session) {
    if (b.session !== CFG.session) { location.reload(); return; }
    const changed = JSON.stringify(BOARD && BOARD.progress) !== JSON.stringify(b.progress);
    BOARD = b; CFG.start = b.start; CFG.limitMin = b.limitMin;
    if (changed && viewingHome && !document.getElementById('sheet')) home();
  }
  flush();
}, 15000);
(async () => {
  if (params.has('board')) return board();
  if (params.has('teacher')) return teacher();
  await loadConfig(); flush();
  if (S.lockUntil > Date.now()) showLock();
  const qr = Number(params.get('qr'));
  ensureTeam(() => (qr ? station(qr) : home()));
})();

</script>
</body>
