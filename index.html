const KEY = 'escape-suspect-v1';

  init() {

    this.ctx = new AC();
    this.master = this.ctx.createGain(); this.master.gain.value = this.on ? 1 : 0; this.master.connect(this.ctx.destination);
    this.music = this.ctx.createGain(); this.music.gain.value = 0.17; this.music.connect(this.master);
  },
  start() { // 반드시 버튼을 누른 순간에 불러야 아이패드에서도 소리가 난다

  },
  stopMusic() { clearInterval(this.timer); this.timer = null; },
  toggle() { this.on = !this.on; store.set(JSON.stringify({ on: this.on }), 'escape-sound'); if (this.master) this.master.gain.value = this.on ? 1 : 0; if (this.on) this.start(); },
  f: (m) => 440 * Math.pow(2, (m - 69) / 12),

  },
  beat(i, t) { // 4마디 반복: Am - F - C - E (긴장감 있는 단조)
    const bar = Math.floor(i / 8), root = [45, 41, 48, 40][bar], pat = [0, 0, 12, 0, 7, 0, 12, 10];

}

function intro() {
  app.innerHTML = '';
  let av = 0;
  const c = $(`<div class="title-card">
    <div class="sub">법과 사회 · 형사 절차와 인권 보장 방탈출</div>
    <h1>억울한 피의자를 구하라</h1>
    <p>고등학생 <b style="color:#F3C9A8">한결</b>(가상 인물)이 편의점 절도범으로 몰렸다.<br>여러분은 한결의 <b style="color:#F3C9A8">국선 변호인 팀</b>. 방 5개를 돌며 <b>위법한 절차</b>를 찾아내라!</p>
    <p style="font-size:16px">🔎 방 안의 물건을 터치하면 변호사가 걸어가 조사합니다 · 🗝️ 방마다 열쇠 글자 1개<br>⏱ ${LIMIT_MIN}분 · 💡 힌트 ${MAX_HINTS}번 · ❌ 틀리면 ${LOCK_SEC}초 잠김</p>
    <div class="q" style="color:#fff">우리 모둠 변호사를 골라 주세요</div>
    <div class="avatars">${AVATARS.map((_, k) => `<button class="av ${k === 0 ? 'on' : ''}" data-k="${k}">${heroSVG(k)}</button>`).join('')}</div>
    <input class="team" id="team" maxlength="12" placeholder="모둠 이름 (예: 3모둠 정의의 변호인)">
    <div><button class="btn warm" id="go">▶ 방탈출 시작 (소리 켜짐)</button></div>
    <button class="btn ghost" id="reset">처음부터 다시 (선생님용)</button>
  </div>`);
  app.append(c);
  c.querySelectorAll('.av').forEach((b) => { b.onclick = () => { av = +b.dataset.k; c.querySelectorAll('.av').forEach((x) => x.classList.toggle('on', x === b)); }; });
  c.querySelector('#go').onclick = () => {
    const t = c.querySelector('#team').value.trim();
    if (!t) { alert('모둠 이름을 적어 주세요.'); return; }
    Snd.start();
    S = fresh(); S.team = t; S.avatar = av; S.start = Date.now(); S.room = 0; save(); render();
  };
  c.querySelector('#reset').onclick = resetAll;
}
function resetAll() { if (confirm('이 태블릿의 진행 기록을 지우고 처음부터 시작할까요?')) { store.clear(); S = fresh(); Snd.stopMusic(); render(); } }

let doorOpen = false; // 방금 푼 방: 문이 열린 채로 보여 주고, 문을 누르면 다음 방으로
function play() {
  const final = S.room >= ROOMS.length;
  const ri = doorOpen ? S.room - 1 : Math.min(S.room, 4);
  const R = ROOMS[ri];
  app.innerHTML = hud();
  const stage = $(`<div class="stage ${doorOpen ? 'open' : ''}"><svg class="scene" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">${SCENES[ri]()}</svg>
    <div class="room-title">${ri < 4 ? R.tag + ' · ' + R.title : '방 5 · 법정'}</div><div class="hero">${heroSVG(S.avatar)}</div><div class="fade"></div></div>`);
  app.append(stage); wireHud();
  placeHero(stage, ...(doorOpen ? feet(...DOOR_SPOT).map((v, k) => (k ? v : v - 14)) : HOME));
  const box = $('<div id="talkbox"></div>'); app.append(box);
  const addSpot = (key, [x, y, em, lb], cls, fn) => {
    const b = $(`<button class="hs ${cls || ''}" data-hs="${key}" style="left:${x}%;top:${y}%"><span class="em">${em}</span><span class="lb">${lb}</span></button>`);
    b.onclick = () => { if (walking || document.getElementById('sheet')) return; walkTo(stage, ...feet(x, y), fn); };
    stage.append(b); return b;
  };
  if (doorOpen) {
    box.innerHTML = talk('🗝️', '열쇠 획득', `문이 열렸다! <b>${R.key}</b> 열쇠를 챙겨 <b>다음 방</b>으로 가자. 열린 문을 터치하세요.`);
    addSpot('door', [DOOR_SPOT[0], DOOR_SPOT[1], '🚪', '다음 방으로'], '', () => {
      walkTo(stage, 97, 84, () => { stage.querySelector('.fade').classList.add('on'); setTimeout(() => { doorOpen = false; render(); }, 650); });
    });
    return;
  }
  if (final) return finalRoom(stage, box, addSpot);
  const P = SPOTS[ri];
  const needFind = R.bad >= 0 && S.step === 0;
  box.innerHTML = talk('🧑‍💼', `${R.tag} · ${R.title}`, `${R.story}<br><b>👉 ${P.record[3]}</b>를 터치해 조사하세요. 막히면 <b>📘 교과서 단서</b>(힌트)를 써도 돼요.`);
  addSpot('record', P.record, '', () => puzzle(R, ri));
  addSpot('clue', P.clue, S.usedHint['r' + ri] ? 'done' : '', () => hintSheet('r' + ri, R.hint, R.page));
  addSpot('door', [DOOR_SPOT[0], DOOR_SPOT[1], '🔒', '잠긴 문'], 'dim', () => {
    const h = stage.querySelector('.hero'); h.classList.add('shake'); setTimeout(() => h.classList.remove('shake'), 450);
    toast('🔒 문이 잠겨 있어요. 먼저 ' + P.record[3] + '를 조사하세요!');
  });
  if (!needFind && R.bad >= 0) box.innerHTML = talk('🧑‍💼', `${R.tag} · ${R.title}`, `위법을 찾아냈다! 이제 <b>${P.record[3]}</b>를 다시 터치해 어떤 권리를 침해했는지 밝히자.`);
}

function hintSheet(id, text, page) {
  if (!S.usedHint[id]) {
    if (S.hints >= MAX_HINTS) { toast('💡 힌트를 모두 썼어요. 교과서 ' + page + '를 펼쳐 보세요!', 2200); return; }
    if (!confirm(`힌트를 쓸까요? (남은 힌트 ${MAX_HINTS - S.hints}개)`)) return;
    S.hints++; S.usedHint[id] = true; save();
    const c = document.querySelector('[data-hs="clue"]'); if (c) c.classList.add('done');
    const hl = document.getElementById('hl'); if (hl) hl.textContent = MAX_HINTS - S.hints;
  }
  sheet(`<span class="tag">📘 교과서 단서</span><span class="page-ref">${page}</span><div class="hint" style="margin-top:12px">${text}</div>`);
}

function puzzle(R, ri) {
  const needFind = R.bad >= 0 && S.step === 0;
  const card = sheet(`<span class="tag">${R.tag} · ${R.title}</span><span class="page-ref">${R.page}</span>
    <p class="q">${needFind ? '① 수사 기록에서 <u>위법한 절차</u>가 적힌 줄을 터치하세요.' : (R.bad >= 0 ? '② ' : '') + R.q2}</p><div id="area"></div>`);
  const area = card.querySelector('#area');
  if (needFind || R.bad < 0) {
    const rec = $(`<div class="record"><div class="head">📄 수사 기록 — 한결 사건</div></div>`);
    R.record.forEach((line, i) => {
      const b = $(`<button class="opt">${line}</button>`);
      if (!needFind) { b.disabled = true; b.style.cursor = 'default'; }
      b.onclick = () => {
        if (i === R.bad) { S.step = 1; save(); Snd.sfx('ok'); b.classList.add('done'); setTimeout(() => { puzzle(R, ri); const t = document.getElementById('talkbox'); if (t) t.innerHTML = talk('🧑‍💼', R.tag, '위법을 찾아냈다! 이제 어떤 권리를 침해했는지 밝히자.'); }, 500); }
        else { b.classList.add('bad'); lock('그 줄은 적법한 절차예요.'); setTimeout(() => b.classList.remove('bad'), 1200); }
      };
      rec.append(b);
    });
    area.append(rec);
    if (!needFind) area.append($('<div style="height:12px"></div>'));
  }
  if (!needFind) {
    if (R.bad >= 0) area.prepend($(`<div class="record" style="margin-bottom:12px"><div class="head">✅ 찾아낸 위법</div><div class="opt done" style="cursor:default">${R.record[R.bad]}</div></div>`));
    const opts = $('<div class="opts"></div>');
    // 보기 순서는 태블릿마다 섞는다 — 모둠끼리 "①번이 답"을 주고받지 못하게
    shuffle(R.opts.map((o, i) => i)).forEach((i, k) => {
      const b = $(`<button class="opt">${String.fromCharCode(9312 + k)} ${R.opts[i]}</button>`);
      b.onclick = () => {
        if (i === R.ans) { S.keys.push(R.key); S.room++; S.step = 0; save(); solved(R); }
        else { b.classList.add('bad'); lock('다시 생각해 보세요.'); setTimeout(() => b.classList.remove('bad'), 1200); }
      };
      opts.append(b);
    });
    area.append(opts);
  }
}

function solved(R) {
  Snd.sfx('key');
  const card = sheet(`<div class="center"><div class="big">🗝️</div><h2>${R.tag} 해결! 열쇠 글자 「${R.key}」 획득</h2></div>
    <div class="learn">${R.learn}</div><div class="center"><button class="btn warm" id="nx">문을 연다 🚪</button></div>`, false);
  card.querySelector('#nx').onclick = () => {
    closeSheet(); doorOpen = true; render(); flyKey(R.key);
    setTimeout(() => Snd.sfx('door'), 200);
  };
}

function finalRoom(stage, box, addSpot) {
  const st = S.step;
  const lines = ['드디어 한결의 재판 날! 법정 안에는 <b>자물쇠 3개</b>가 걸려 있다. <b>📜 절차 순서판</b>부터 풀자.',
    '순서판이 열렸다! 법정 앞에서 <b>🎤 기자</b>가 소리치고 있다. 기자에게 가 보자.',
    '이제 <b>🔐 법정 문 자물쇠</b>. 네 방에서 모은 열쇠 글자로 원칙의 이름을 완성하자!',
    '법정 문이 열렸다! <b>⚖️ 재판부</b>에게 가서 마지막 질문에 답하자.'];
  box.innerHTML = talk('🧑‍💼', '방 5 · 법정', lines[st]);
  FINAL_SPOTS.forEach((sp, k) => addSpot('final' + k, sp, k < st ? 'done' : (k > st ? 'dim' : ''), () => {
    if (k !== st) { toast(k < st ? '✅ 이미 풀었어요' : '🔒 앞의 자물쇠부터 풀어요'); return; }
    finalPuzzle(st);
  }));
  addSpot('clue', [10, 46, '📘', '교과서 단서'], S.usedHint['final' + st] ? 'done' : '', () => hintSheet('final' + st,
    ['수사 기관이 조사 → 경찰이 검찰로 넘김 → 검사가 법원에 재판 신청 → 재판 → 판결 순서예요. (교과서 78~79쪽 흐름도)', '유죄 판결이 확정될 때까지 피고인은 어떻게 대우받아야 할까요?', '네 방에서 얻은 글자를 순서대로! 형사 절차 전체를 지배하는 원칙의 이름이에요. (교과서 80쪽 첫 문단)', '구금되었다가 무죄 판결을 받은 사람이 국가에 청구하는 제도예요. (교과서 81쪽)'][st], '교과서 78~81쪽'));
}

function finalPuzzle(st) {
  const next = () => { S.step++; save(); Snd.sfx('door'); closeSheet(); render(); };
  if (st === 0) {
    const card = sheet(`<span class="tag">자물쇠 ① 절차 순서판</span><span class="page-ref">교과서 78~79쪽</span><p class="q">형사 절차를 순서대로 터치하세요.</p><div class="seq"></div><div class="opts"></div>`);
    const seq = card.querySelector('.seq'), box = card.querySelector('.opts'); let picked = [];
    shuffle(FINAL.order).forEach((step) => {
      const b = $(`<button class="opt">${step}</button>`);
      b.onclick = () => {
        if (picked.includes(step)) return;
        if (step !== FINAL.order[picked.length]) { picked = []; seq.innerHTML = ''; box.querySelectorAll('.opt').forEach((x) => x.classList.remove('sel')); lock('순서가 틀렸어요. 처음부터!'); return; }
        picked.push(step); b.classList.add('sel'); seq.append($(`<span class="chip">${picked.length}. ${step}</span>`)); Snd.sfx('step');
        if (picked.length === FINAL.order.length) { Snd.sfx('ok'); setTimeout(next, 600); }
      };
      box.append(b);
    });
  } else if (st === 1) {
    const card = sheet(`<span class="tag">자물쇠 ② 기자</span><span class="page-ref">교과서 80쪽</span><p class="q">${FINAL.q}</p><div class="opts"></div>`);
    const box = card.querySelector('.opts');
    shuffle(FINAL.opts.map((o, i) => i)).forEach((i, k) => {
      const b = $(`<button class="opt">${String.fromCharCode(9312 + k)} ${FINAL.opts[i]}</button>`);
      b.onclick = () => { if (i === FINAL.ans) next(); else lock('다시 생각해 보세요.'); };
      box.append(b);
    });
  } else if (st === 2) {
    const card = sheet(`<span class="tag">자물쇠 ③ 법정 문</span><span class="page-ref">교과서 80쪽</span><p class="q">열쇠 글자 네 개로 원칙의 이름을 완성하세요.</p>
      <p>"누구든지 법률에 규정된 절차에 따르지 않고는 처벌할 수 없다." — 이 원칙은?</p>
      <div class="center"><input class="word" id="w" maxlength="4" autocomplete="off"><br><button class="btn warm" id="ok">법정 문 열기</button></div>`);
    card.querySelector('#ok').onclick = () => {
      const v = card.querySelector('#w').value.replace(/\s/g, '');
      if (v === FINAL.word) next(); else lock('그 단어가 아니에요.');
    };
  } else {
    const card = sheet(`<span class="tag">마지막 질문 · 재판부</span><span class="page-ref">교과서 81쪽</span>
      <div class="learn"><b>적법 절차의 원칙</b> 덕분에 한결은 공정한 재판을 받았습니다. 위법하게 얻은 자백과 증거는 모두 증거에서 빠졌어요.</div>
      <p class="q">${FINAL.epilogue}</p><div class="opts"></div>`);
    const box = card.querySelector('.opts');
    shuffle(FINAL.epOpts.map((o, i) => i)).forEach((i, k) => {
      const b = $(`<button class="opt">${String.fromCharCode(9312 + k)} ${FINAL.epOpts[i]}</button>`);
      b.onclick = () => { if (i === FINAL.epAns) { S.end = Date.now(); save(); Snd.sfx('win'); Snd.stopMusic(); render(); } else lock('다시 생각해 보세요.'); };
      box.append(b);
    });
  }
}

// 제한 시간이 끝나면 진행을 멈추고 결과를 보여 준다. 배움을 끝까지 하도록 '마저 풀기'는 남기되 기록엔 시간 초과로 남는다.
function timeUp() {
  app.innerHTML = '';
  const c = $(`<div class="title-card">
    <div class="big">⏰</div><h1>시간 종료!</h1>
    <p>국선 변호인 팀 <b>${esc(S.team)}</b>의 ${LIMIT_MIN}분 기록입니다. 이 화면을 선생님께 보여 주세요.</p>
    <div class="card" style="background:#fff;color:#14161F;border-radius:16px;padding:6px 14px"><table class="res">
      <tr><td>🗝️ 모은 열쇠</td><td><b>${S.keys.length}</b> / 4 ${S.keys.length ? '(' + S.keys.join('') + ')' : ''}</td></tr>
      <tr><td>🚪 도착한 방</td><td><b>방 ${Math.min(S.room + 1, 5)}</b></td></tr>
      <tr><td>💡 쓴 힌트</td><td><b>${S.hints}</b>개</td></tr>
      <tr><td>❌ 틀린 횟수</td><td><b>${S.wrong}</b>번</td></tr></table></div>
    <button class="btn" id="more">남은 방 마저 풀기 (기록: 시간 초과)</button><br>
    <button class="btn ghost" id="reset">처음부터 다시 (선생님용)</button></div>`);
  app.append(c);
  c.querySelector('#more').onclick = () => { S.overtime = true; save(); render(); };
  c.querySelector('#reset').onclick = resetAll;
}

function finish() {
  app.innerHTML = '';
  const t = elapsed();
  // 성공 여부는 실제 걸린 시간으로 판단한다 — 종료 화면이 뜨기 직전 1초 안에 누른 정답도 시간 초과로
  const late = S.overtime || S.end - S.start > LIMIT_MIN * 60 * 1000; // 초를 버림하면 25:00.5가 '25:00'으로 통과해 버린다 → 밀리초로 비교
  const c = $(`<div class="title-card">
    <div style="width:120px;margin:0 auto">${heroSVG(S.avatar)}</div>
    <h1>${late ? '시간 초과 탈출' : '탈출 성공!'}</h1>
    <p>한결을 구했습니다. 국선 변호인 팀 <b>${esc(S.team)}</b> 수고했어요!</p>
    <div class="card" style="background:#fff;color:#14161F;border-radius:16px;padding:6px 14px"><table class="res">
      <tr><td>⏱ 탈출 시간</td><td><b>${fmt(t)}</b> ${late ? '(시간 초과)' : ''}</td></tr>
      <tr><td>💡 쓴 힌트</td><td><b>${S.hints}</b>개</td></tr>
      <tr><td>❌ 틀린 횟수</td><td><b>${S.wrong}</b>번</td></tr>
      <tr><td>🕒 끝난 시각</td><td>${new Date(S.end).toLocaleTimeString('ko-KR')}</td></tr></table>
    <div class="learn" style="text-align:left">오늘 찾은 권리: <b>미란다 원칙 · 진술 거부권과 자백의 증거 능력 · 영장주의와 위법 수집 증거 배제 · 구속 적부심 · 무죄 추정 · 형사 보상</b></div></div>
    <p style="font-size:16px">이 화면을 선생님께 보여 주세요.</p>
    <button class="btn ghost" id="reset">처음부터 다시 (선생님용)</button></div>`);
  app.append(c);
  c.querySelector('#reset').onclick = resetAll;
}

setInterval(() => {
  const el = document.getElementById('clock');
  if (!el || S.end) return;
  const left = LIMIT_MIN * 60 - elapsed();
  el.textContent = fmt(left); el.classList.toggle('danger', left < 300);
  if (left < 300 && Snd.tempo !== 118) Snd.tempo = 118; // 5분 남으면 음악이 빨라진다
  if (left <= 0 && !S.overtime) render(); // 시간이 다 되면 그 자리에서 멈춤
}, 1000);
render();
if (S.lockUntil > Date.now()) showLock();
</script>
</body>
</html>
